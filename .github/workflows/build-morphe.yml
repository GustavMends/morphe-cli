name: Build Morphe Patched Apps

# Disparo manual por enquanto. Depois dá pra adicionar um `schedule:` se
# quiser builds automáticos periódicos.
on:
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar a Release

jobs:
  # ---------------------------------------------------------------------
  # 1) Lê apps.yml e transforma em matrix + calcula a tag da release
  # ---------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: pip install pyyaml

      - name: Gerar matrix a partir de apps.yml
        id: set-matrix
        run: |
          python3 -c "
          import json, yaml
          with open('apps.yml') as f:
              data = yaml.safe_load(f)
          print(json.dumps({'include': data['apps']}))
          " > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Definir tag da release (data + hora, evita colisão entre builds no mesmo dia)
        id: tag
        run: echo "tag=apks-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 2) Cria a Release vazia ANTES da matrix, uma única vez.
  #    Isso evita corrida entre os jobs paralelos tentando criar a mesma
  #    release ao mesmo tempo — cada job da matrix só precisa anexar seu
  #    próprio arquivo depois.
  # ---------------------------------------------------------------------
  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Criar release vazia
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "Build ${{ needs.prepare.outputs.release_tag }}"

  # ---------------------------------------------------------------------
  # 3) Baixa o APK de cada app (matrix), aplica os patches do Morphe e
  #    anexa o APK direto na Release (sem passar por Actions Artifacts,
  #    que tem cota de armazenamento própria e estourava com APKs grandes).
  # ---------------------------------------------------------------------
  build:
    needs: [prepare, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar morphe-data (keystore) a partir dos secrets
        env:
          MORPHE_KEYSTORE_B64: ${{ secrets.MORPHE_KEYSTORE_B64 }}
        run: |
          set -e
          echo "$MORPHE_KEYSTORE_B64" | base64 -d > "$HOME/imported.keystore"
          echo MORPHE_KEYSTORE_FILE="$HOME/imported.keystore" >> "$GITHUB_ENV"

      - name: Baixar Morphe Desktop (release mais recente)
        run: |
          set -e
          JAR_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest \
            | jq -r '.assets[] | select(.name | test("-all\\.jar$")) | .browser_download_url')
          if [ -z "$JAR_URL" ]; then
            echo "Não encontrei o asset *-all.jar na release do morphe-desktop" >&2
            exit 1
          fi
          echo "Baixando $JAR_URL"
          curl -L -o morphe-desktop-all.jar "$JAR_URL"

      - name: Baixar patches (${{ matrix.patches_repo }})
        run: |
          set -e
          PATCH_URL=$(curl -s "https://api.github.com/repos/${{ matrix.patches_repo }}/releases/latest" \
            | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url')
          if [ -z "$PATCH_URL" ]; then
            echo "Não encontrei nenhum asset .mpp na release de ${{ matrix.patches_repo }}" >&2
            exit 1
          fi
          echo "Baixando $PATCH_URL"
          # Renomeado com o nome do app para não colidir caso mais de um
          # arquivo .mpp exista no workspace (ex: builds locais/paralelos).
          curl -L -o "patches-${{ matrix.name }}.mpp" "$PATCH_URL"

      - name: Baixar APK do repo espelho (${{ matrix.mirror_repo }} @ ${{ matrix.mirror_tag }})
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          set -e
          ASSET_URL=$(curl -s \
            -H "Authorization: token ${MIRROR_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ matrix.mirror_repo }}/releases/tags/${{ matrix.mirror_tag }}" \
            | jq -r --arg name "${{ matrix.mirror_asset }}" '.assets[] | select(.name == $name) | .url')

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Não encontrei o asset '${{ matrix.mirror_asset }}' na tag '${{ matrix.mirror_tag }}' de ${{ matrix.mirror_repo }}" >&2
            echo "Confira se você já subiu o APK dessa versão no repo espelho." >&2
            exit 1
          fi

          # IMPORTANTE: preservamos a extensão real do asset (.apk ou .apkm).
          # O Morphe decide se faz merge de bundle split (apkm) com base na
          # extensão do arquivo — forçar ".apk" num arquivo que na verdade é
          # um .apkm quebra o patch (manifest null) mesmo com o conteúdo certo.
          ASSET_NAME="${{ matrix.mirror_asset }}"
          EXT="${ASSET_NAME##*.}"
          INPUT_FILE="${{ matrix.output_name }}.${EXT}"
          echo "INPUT_FILE=${INPUT_FILE}" >> "$GITHUB_ENV"

          curl -L \
            -H "Authorization: token ${MIRROR_REPO_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "${INPUT_FILE}" \
            "$ASSET_URL"
          # NOTA: usamos a API (asset "url", não "browser_download_url") com
          # Accept: application/octet-stream porque isso funciona tanto para
          # repositório privado quanto público — não precisa saber de antemão
          # qual é o caso.

      - name: Aplicar patches do Morphe
        env:
          MORPHE_KEYSTORE_ALIAS: ${{ secrets.MORPHE_KEYSTORE_ALIAS }}
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
        run: |
          set -e
          cd "$HOME"
          java -jar "${{ github.workspace }}/morphe-desktop-all.jar" patch \
            -p "${{ github.workspace }}/patches-${{ matrix.name }}.mpp" \
            --keystore="$MORPHE_KEYSTORE_FILE" --keystore-entry-alias="$MORPHE_KEYSTORE_ALIAS" \
            --keystore-entry-password="$MORPHE_KEYSTORE_PASSWORD" --keystore-password="$MORPHE_KEYSTORE_PASSWORD" \
            -o "${{ github.workspace }}/${{ matrix.output_name }}-morphe.apk" \
            "${{ github.workspace }}/${{ env.INPUT_FILE }}"
          # PRESSUPOSTO: flags "-p" (patches) e "-o" (output) seguem o padrão
          # do CLI do ReVanced/Morphe. Confira com
          # `java -jar morphe-desktop-all.jar patch --help` e ajuste se o
          # nome das flags for diferente na sua versão.

      - name: Anexar APK direto na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "Build ${{ needs.prepare.outputs.release_tag }}"
          files: ${{ matrix.output_name }}-morphe.apk

  # ---------------------------------------------------------------------
  # 4) Notifica o status final via bot do Telegram (sempre roda)
  # ---------------------------------------------------------------------
  notify:
    needs: [prepare, create-release, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BUILD_STATUS="${{ needs.build.result }}"
          RELEASE_STATUS="${{ needs['create-release'].result }}"
          TAG="${{ needs.prepare.outputs.release_tag }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$BUILD_STATUS" = "success" ] && [ "$RELEASE_STATUS" = "success" ]; then
            TEXT="✅ Build Morphe concluído com sucesso.%0ARelease: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          else
            TEXT="❌ Build Morphe falhou (build=$BUILD_STATUS, release=$RELEASE_STATUS).%0ADetalhes: $RUN_URL"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT"
